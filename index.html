<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parking AI Field Test v4</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{font-family:Arial;margin:0;background:#eef4ff}header{background:#2563eb;color:#fff;padding:20px;text-align:center}main{max-width:900px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:16px}button,input,select{width:100%;padding:12px;margin-top:10px;border-radius:10px}button{background:#2563eb;color:#fff;border:none}video,img{width:100%;border-radius:12px}.counter{background:#f3f4f6;padding:10px;border-radius:10px;margin:10px 0}.hidden{display:none}</style></head><body><header><h1>Parking AI Field Test v4</h1><p>Inloggning + permanent lagring på samma telefon</p></header><main><div class="card"><div id="loginView"><h3>Användare</h3><input id="userName" placeholder="Ditt namn eller testprofil"><button onclick="login()">Logga in</button></div><div id="appView" class="hidden"><div id="who"></div><div id="counter" class="counter"></div><button onclick="logout()">Logga ut</button><button onclick="startCamera()">Starta kamera</button><div id="status">Redo</div><video id="video" autoplay muted playsinline style="display:none"></video><button id="captureBtn" style="display:none" onclick="analyze()">Ta bild och analysera</button><button onclick="exportData()">📥 Exportera testdata</button><div id="result"></div></div></div></main><script>let stream,currentCase=null;let currentUser='';function key(){return 'parkingAI_'+currentUser;}function getCases(){return JSON.parse(localStorage.getItem(key())||'[]');}function saveCases(a){localStorage.setItem(key(),JSON.stringify(a));}function updateCounter(){counter.innerText='📊 Sparade testfall: '+getCases().length;}function login(){const n=userName.value.trim();if(!n){alert('Ange namn');return;}localStorage.setItem('parkingAI_currentUser',n);currentUser=n;showApp();}function logout(){localStorage.removeItem('parkingAI_currentUser');location.reload();}function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.innerHTML='<b>Inloggad:</b> '+currentUser;updateCounter();}const savedUser=localStorage.getItem('parkingAI_currentUser');if(savedUser){currentUser=savedUser;window.addEventListener('load',showApp);}async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;video.style.display='block';captureBtn.style.display='block';status.innerText='✅ Kamera aktiv';}catch(e){alert('Kunde inte starta kameran');}}async function analyze(){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);const image=c.toDataURL('image/jpeg',0.8);status.innerText='Läser skylt...';let text='';try{const r=await Tesseract.recognize(c,'swe+eng');text=(r.data.text||'').toLowerCase();}catch(e){}const words=['park','parkering','avgift','tim','timmar','zon','boende','besök'];const hits=words.filter(w=>text.includes(w));let score=0,verdict='⛔ Ingen tydlig parkeringsinformation hittad';if(hits.length===1){score=60;verdict='⚠ Möjlig parkeringsskylt';}if(hits.length>=2){score=90;verdict='✅ Troligen parkeringsskylt';}currentCase={timestamp:new Date().toISOString(),image,ocr:text,keywords:hits,score,verdict,user:currentUser};result.innerHTML=`<img src="${image}"><h3>${verdict}</h3><p>${score}%</p><select id="human"><option value="">Välj bedömning</option><option value="korrekt">✅ Rätt</option><option value="fel">❌ Fel</option><option value="osäker">🤔 Osäker</option></select><button onclick="saveCase()">💾 Spara testfall</button>`;status.innerText='✅ Klar';}function saveCase(){const v=human.value;if(!v){alert('Välj bedömning');return;}let arr=getCases();arr.push({...currentCase,humanAssessment:v});saveCases(arr);updateCounter();alert('Sparat. Totalt: '+arr.length);}function exportData(){const data=localStorage.getItem(key())||'[]';const b=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parking-ai-testdata-'+currentUser+'.json';a.click();}</script></body></html>
