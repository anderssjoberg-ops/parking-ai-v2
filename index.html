<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Parking AI v14</title><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script><style>body{font-family:Arial;margin:0;background:#eef4ff}header{background:#2563eb;color:#fff;padding:20px;text-align:center}main{max-width:800px;margin:auto;padding:20px}button{width:100%;padding:14px;margin-top:10px;background:#2563eb;color:white;border:none;border-radius:10px}video{width:100%;display:none;border-radius:12px}.score{font-size:36px;font-weight:bold}</style></head><body><header><h1>Parking AI v14</h1></header><main><button onclick="startCamera()">Starta kamera</button><div id="status">Laddar AI...</div><video id="video" autoplay muted playsinline></video><button id="analyzeBtn" style="display:none" onclick="analyze()">Analysera</button><div id="result"></div></main><script>let model=null,stream=null;const video=document.getElementById('video');(async()=>{try{model=await cocoSsd.load();status.innerText='✅ AI redo';}catch(e){status.innerText='⚠ AI kunde inte laddas';}})();async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;await video.play();video.style.display='block';analyzeBtn.style.display='block';status.innerText='✅ Kamera aktiv';}catch(e){alert('Kunde inte starta kameran');}}async function analyze(){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);let names=[];let score=10;if(model){const objs=await model.detect(c);names=objs.map(o=>o.class);if(names.includes('car')||names.includes('truck'))score+=40;if(names.includes('person')&&!names.includes('car'))score=5;}result.innerHTML='<div class="score">'+score+'%</div><p>'+names.join(', ')+'</p><button onclick="alert('Tack!')">👍 Hjälpte mig</button><button onclick="prompt('Vad saknades eller var fel?')">👎 Hjälpte inte</button>';}</script></body></html>
