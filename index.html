<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking AI v13</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{margin:0;font-family:Arial;background:#eef4ff}
header{background:#2563eb;color:white;text-align:center;padding:20px}
main{max-width:800px;margin:auto;padding:20px}
button{width:100%;padding:16px;border:none;border-radius:10px;background:#2563eb;color:white;margin-top:10px}
video{width:100%;margin-top:10px;border-radius:12px}
.status{margin-top:10px;font-weight:bold}
.score{font-size:36px;font-weight:bold;margin-top:10px}
</style>
</head>

<body>

<header>
<h1>Parking AI (Test v13)</h1>
<p>Stabil kamera + AI + feedback</p>
</header>

<main>

<button onclick="startCamera()">Starta kamera</button>
<div id="status" class="status">Redo</div>

<!-- ✅ FIX: muted + autoplay + playsinline -->
<video id="video" autoplay muted playsinline style="display:none"></video>

<button onclick="analyze()" id="analyzeBtn" style="display:none">Analysera</button>

<div id="result"></div>

</main>

<script>
let model = null;
let aiReady = false;
let stream = null;

const video = document.getElementById("video");
const statusEl = document.getElementById("status");

// ✅ AI laddas i bakgrunden
setTimeout(async () => {
  try{
    statusEl.innerText = "Laddar AI...";
    model = await cocoSsd.load();
    aiReady = true;
    statusEl.innerText = "✅ AI redo";
  }catch(e){
    statusEl.innerText = "⚠ AI ej tillgänglig";
    console.error(e);
  }
}, 500);

// ✅ FIXAD KAMERA-FUNKTION
async function startCamera(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert("❌ Kamera stöds inte här. Testa via GitHub Pages.");
      return;
    }

    statusEl.innerText = "Startar kamera...";

    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"environment" }
    });

    video.srcObject = stream;

    // ✅ VIKTIGT: tvinga start
    await video.play();

    video.style.display = "block";
    document.getElementById("analyzeBtn").style.display = "block";

    statusEl.innerText = "✅ Kamera aktiv";

  }catch(e){
    console.error(e);
    statusEl.innerText = "❌ Kamera fel";

    alert(
      "Kunde inte starta kamera\n\n" +
      "Testa:\n" +
      "- Tillåt kamera\n" +
      "- Använd Chrome/Safari\n" +
      "- Uppdatera sidan"
    );
  }
}

// ✅ ANALYS (funks med eller utan AI)
async function analyze(){

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  statusEl.innerText = "Analyserar...";

  let objects = [];
  let score = 10;

  if(aiReady && model){
    try{
      objects = await model.detect(canvas);
    }catch(e){
      console.log("AI fel");
    }
  }

  const names = objects.map(o=>o.class);

  // ✅ ENKEL LOGIK
  if(names.includes("car") || names.includes("truck")){
    score += 40;
  }

  if(names.includes("person") && !names.includes("car")){
    score = 5;
  }

  if(!aiReady){
    score = 20;
  }

  let verdict =
    score > 60 ? "✅ Troligen parkering"
    : score > 30 ? "⚠ Osäkert"
    : "⛔ Ej parkering";

  statusEl.innerText = aiReady ? "✅ Klar (AI)" : "✅ Klar (utan AI)";

  document.getElementById("result").innerHTML = `
    <div class="score">${score}%</div>
    <p>${verdict}</p>
    <p><b>Objekt:</b> ${names.join(", ") || "Ingen AI-data"}</p>

    <button onclick="feedback(true)">👍 Hjälpte mig</button>
    <button onclick="feedback(false)">👎 Hjälpte inte</button>
  `;
}

// ✅ FEEDBACK
function feedback(good){
  if(good){
    alert("Tack! 🙌");
  } else {
    const txt = prompt("Vad saknades eller var fel?");
    console.log("Feedback:", txt);
  }
}
</script>

</body>
</html>
``
