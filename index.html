<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking AI Field Test v2</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#eef4ff;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:20px;
}

main{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
}

button,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    cursor:pointer;
}

video,img{
    width:100%;
    border-radius:12px;
}

.score{
    font-size:40px;
    font-weight:bold;
}

.good{
    color:#16a34a;
}

.warn{
    color:#d97706;
}

.bad{
    color:#dc2626;
}

pre{
    white-space:pre-wrap;
}

.result{
    margin-top:15px;
}
</style>

</head>
<body>

<header>
    <h1>Parking AI Field Test v2</h1>
    <p>Samla testfall för förbättring av regelmotorn</p>
</header>

<main>

<div class="card">

    <button onclick="startCamera()">
        Starta kamera
    </button>

    <div id="status">Redo</div>

    <video
        id="video"
        autoplay
        muted
        playsinline
        style="display:none">
    </video>

    <button
        id="captureBtn"
        style="display:none"
        onclick="analyze()">
        Ta bild och analysera
    </button>

    <button onclick="exportData()">
        📥 Exportera testdata
    </button>

    <div id="result"></div>

</div>

</main>

<script>

let stream;
let currentCase = null;
let testCases = [];

async function startCamera(){

    try{

        stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            }
        });

        video.srcObject = stream;

        video.style.display = "block";

        captureBtn.style.display = "block";

        status.innerText = "✅ Kamera aktiv";

    }
    catch(error){

        console.error(error);

        alert(
            "Kunde inte starta kameran.\n\n" +
            "Testa via GitHub Pages och ge kameratillstånd."
        );
    }
}

async function analyze(){

    const canvas =
    document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0
    );

    const image =
    canvas.toDataURL(
        "image/jpeg",
        0.8
    );

    status.innerText =
    "Läser skylt...";

    let text = "";

    try{

        const result =
        await Tesseract.recognize(
            canvas,
            "swe+eng"
        );

        text =
        (result.data.text || "")
        .toLowerCase();

    }
    catch(error){

        console.error(error);
    }

    const words = [
        "park",
        "parkering",
        "avgift",
        "tim",
        "timmar",
        "zon",
        "boende",
        "besök",
        "biljett",
        "vardag",
        "helg"
    ];

    const hits =
    words.filter(word =>
        text.includes(word)
    );

    let score = 0;
    let cls = "bad";
    let verdict =
    "⛔ Ingen tydlig parkeringsinformation hittad";

    if(hits.length === 1){

        score = 60;
        cls = "warn";
        verdict =
        "⚠ Möjlig parkeringsskylt";
    }

    if(hits.length >= 2){

        score = 90;
        cls = "good";
        verdict =
        "✅ Troligen parkeringsskylt";
    }

    currentCase = {

        timestamp:
        new Date().toISOString(),

        image: image,

        ocr: text,

        keywords: hits,

        score: score,

        verdict: verdict
    };

    document.getElementById(
        "result"
    ).innerHTML = `

        <img src

        <div class="result">

            <div class="score ${cls}">
                ${score}%
            </div>

            <h3>
                ${verdict}
            </h3>

            <p>
                <b>Nyckelord:</b>
                ${hits.join(", ") || "inga"}
            </p>

            <details>
                <summary>
                    Visa OCR-text
                </summary>

                <pre>
${text || "Ingen text"}
                </pre>

            </details>

            <label>
                <b>
                Din bedömning av appens svar:
                </b>
            </label>

            <select id="human">

                <option value="">
                    Välj...
                </option>

                <option value="korrekt">
                    ✅ Appen hade rätt
                </option>

                <option value="fel">
                    ❌ Appen hade fel
                </option>

                <option value="osäker">
                    🤔 Osäker
                </option>

            </select>

            <button onclick="saveCase()">
                💾 Spara testfall
            </button>

        </div>
    `;

    status.innerText =
    "✅ Klar";
}

function saveCase(){

    const value =
    document.getElementById(
        "human"
    ).value;

    if(!value){

        alert(
            "Välj din bedömning först"
        );

        return;
    }

    currentCase.humanAssessment =
    value;

    testCases.push(
        currentCase
    );

    alert(
        "Testfall sparat. Totalt: " +
        testCases.length
    );
}

function exportData(){

    const blob =
    new Blob(
        [
            JSON.stringify(
                testCases,
                null,
                2
            )
        ],
        {
            type:"application/json"
        }
    );

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(blob);

    link.download =
    "parking-ai-testdata.json";

    link.click();
}

</script>

</body>
</html>
